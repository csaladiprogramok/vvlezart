<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:Arial,Helvetica,sans-serif;color:#17324d;background:radial-gradient(circle at top left,#fff4cf 0%,transparent 34%),linear-gradient(135deg,#f3d7a4,#fffaf0)}
.navbar{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;padding:1em 2em;position:sticky;top:0;z-index:1000;font-family:'Segoe UI',sans-serif;text-align:left}.logo{font-size:1.5em;font-weight:700;color:yellowgreen;text-decoration:none}.navbar .exit-x{display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:-7px;border-radius:50%;color:#333;text-decoration:none;font-size:27px;font-weight:600;line-height:1;transition:background .2s ease}.navbar .exit-x:hover,.navbar .exit-x:focus-visible{background:rgba(154,205,50,.12)}

.content{padding:28px 16px 60px}.counter-card{width:min(100%,650px);margin:0 auto;padding:34px 30px 32px;border-radius:32px;border:1px solid #dceac5;background:linear-gradient(145deg,#fff,#f4ffe9);box-shadow:0 16px 35px #6b8c2524;text-align:center}.total{font-size:clamp(39px,8vw,66px);font-weight:900;letter-spacing:-2px;color:#598d16;text-shadow:0 5px 15px #598d1624;margin:0 0 8px;font-variant-numeric:tabular-nums}.total-label{display:inline-block;margin:0 0 24px;padding:7px 16px;border-radius:999px;background:#eff8d9;border:1px solid #d3e9a6;color:#628c17;font-weight:900;font-size:13px;letter-spacing:.06em}.person{padding:19px 0;text-align:left;border-top:1px solid #dce8ce}.person-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:9px}.person-name{font-size:clamp(17px,3.5vw,21px);font-weight:900;color:#365c12}.person-amount{font-weight:900;color:#598d16;font-size:clamp(17px,3.5vw,20px);font-variant-numeric:tabular-nums}.track{height:16px;border-radius:999px;background:#e1e7db;box-shadow:inset 0 2px 5px #0002;overflow:hidden;padding:3px}.fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#86ca29,#2bbac8)}.person-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:9px;color:#60727b;font-size:13px;font-weight:700}.percent{color:#5e8e12;background:#edf7d8;padding:3px 10px;border-radius:999px}.deadline{color:#60727b}.deadline strong{color:#365c12}
@media(max-width:620px){.content{padding:24px 12px 40px}.counter-card{padding:26px 18px 22px;border-radius:25px}.total{letter-spacing:-1.5px}.person{padding:17px 0}.person-foot{font-size:12px}}@media(max-width:360px){.counter-card{padding:22px 13px}.total{font-size:clamp(33px,10vw,39px)}.person-head{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){#summer-countdown:before,#summer-countdown .sun,#summer-countdown .palm{animation:none}}

/* Tájékoztató kártya a visszaszámláló és a számláló között */
.intro-card{width:min(100%,650px);margin:0 auto 22px;padding:23px 27px;background:rgba(255,255,255,.94);border:1px solid #e2edcf;border-radius:24px;box-shadow:0 10px 28px #6b8c251a;color:#365c12;text-align:center}
.intro-card p{margin:0;font-size:clamp(15px,2.3vw,18px);line-height:1.65;font-weight:600}
/* Későbbi használatra megtartott, jelenleg kikommentelt Hamarosan blokk */
.coming-soon{display:flex;align-items:center;justify-content:center;gap:16px;margin:35px auto;text-align:center}
.coming-soon h2{font-size:clamp(28px,7vw,52px);font-weight:900;letter-spacing:-1px;line-height:1.2;background:linear-gradient(90deg,#087f8c,#00b8c8,#ffb703,#ff8c42,#087f8c);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:comingColors 5s linear infinite,soonFloat 2.8s ease-in-out infinite}
.coming-line{width:min(150px,15vw);height:3px;border-radius:99px;background:linear-gradient(90deg,transparent,#00a9b7,#ffb703,transparent)}
@keyframes comingColors{from{background-position:0 center}to{background-position:300% center}}
@keyframes soonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(max-width:620px){.intro-card{padding:18px 16px;border-radius:20px;margin-bottom:18px}.coming-soon{gap:10px}.coming-line{width:min(95px,13vw)}}
@media(prefers-reduced-motion:reduce){.coming-soon h2{animation:none}}









    /* ===== NYÁRI VISSZASZÁMLÁLÓ ===== */
    #summer-countdown {
      /* 💻 ASZTALI / LAPTOP: ezt állítsd */
      top: 80px;

      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;

      width: min(76%, 520px);
      min-height: 28px;
      padding: 2px 8px;
      box-sizing: border-box;

      background: rgba(255,255,255,.96);
      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;

      color: #155e75;
      font-size: clamp(11px, 1.5vw, 14px);
      font-weight: 800;
      line-height: 1;

      box-shadow: 0 3px 9px rgba(0,0,0,.12);
    }

    #summer-countdown::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -35%;
      width: 30%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,215,0,.62),
        transparent
      );
      animation: shine 4s linear infinite;
    }

    #summer-countdown .sun,
    #summer-countdown .palm,
    #summer-countdown .text {
      position: relative;
      z-index: 1;
    }

    #summer-countdown .text {
      flex: 1;
      min-width: 0;
      text-align: center;
      line-height: 1.05;
      white-space: nowrap;
    }

    #summer-countdown .sun,
    #summer-countdown .palm {
      flex: 0 0 auto;
      font-size: 15px;
    }

    #summer-countdown .sun {
      animation: sun 2.4s ease-in-out infinite;
    }

    #summer-countdown .palm {
      transform-origin: bottom center;
      animation: palm 2.2s ease-in-out infinite;
    }

    #summer-countdown .days-highlight {
      color: #ff4f87;
      font-size: inherit;
      font-weight: 900;
      display: inline-block;
    }

    @keyframes shine {
      from { left: -35%; }
      to   { left: 120%; }
    }

    @keyframes sun {
      0%,100% { transform: rotate(-8deg) scale(1); }
      50%     { transform: rotate(8deg) scale(1.08); }
    }

    @keyframes palm {
      0%,100% { transform: rotate(-4deg); }
      50%     { transform: rotate(4deg); }
    }

    /* 📱 MOBIL: külön állítható TOP */
    @media (max-width: 700px) {
      #summer-countdown {
        top: 68px;   /* 📱 MOBILON EZT ÁLLÍTSD */

        width: 78%;
        max-width: 360px;
        min-height: 25px;
        padding: 2px 6px;
        gap: 3px;
        border-radius: 7px;

        font-size: clamp(9px, 2.8vw, 11px);
      }

      #summer-countdown .sun,
      #summer-countdown .palm {
        font-size: 13px;
      }
    }

    /* Keskeny telefonon csak a méret változik, a TOP nem */
    @media (max-width: 380px) {
      #summer-countdown {
        top: 12%;
        width: 82%;
        max-width: 300px;
        font-size: 9px;
        padding-left: 5px;
        padding-right: 5px;
      }

      #summer-countdown .sun,
      #summer-countdown .palm {
        font-size: 12px;
      }
    }

    /* Az eredeti oldal betűcsaládjának explicit öröklése */
    #summer-countdown { font-family: 'Segoe UI', sans-serif; }

</style>

<script>
function updateCountdown() {
  const now = new Date();
  const text = document.querySelector("#summer-countdown .text");
  const year = now.getFullYear();

  const june1 = new Date(year, 5, 1, 0, 0, 0);
  const sep1  = new Date(year, 8, 1, 0, 0, 0);

  // Június 1-től augusztus 31-ig nyári felirat
  if (now >= june1 && now < sep1) {
    text.innerHTML = '„NYÁR VAN, ALIG FÜRDŐRUHÁBAN...”';
    return;
  }

  // Szeptember 1-től május 31-ig visszaszámlálás
  const target =
    now >= sep1
      ? new Date(year + 1, 5, 1, 0, 0, 0)
      : june1;

  const days = Math.ceil((target - now) / 86400000);

  text.innerHTML =
    'MÁR CSAK <span class="days-highlight"><span id="days">' +
    days +
    '</span> NAP</span> ÉS ITT A NYÁR!';
}

updateCountdown();
setInterval(updateCountdown, 60000);
</script>
