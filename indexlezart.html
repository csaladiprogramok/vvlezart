<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VakációVágyó</title>
<style>
:root{--green:#9acd32;--ink:#33412d;--cream:#fefcc8}*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#fefcc8 0%,#fff6c8 55%,#dff7e8 100%);color:var(--ink);min-height:100vh}.navbar{background:#fff;box-shadow:0 2px 10px #0000001a;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:18px clamp(16px,3vw,42px);position:sticky;top:0;z-index:5}.logo{font-size:clamp(19px,2vw,25px);font-weight:800;color:yellowgreen;text-decoration:none;white-space:nowrap}.menu{display:flex;align-items:center;gap:clamp(9px,1.35vw,21px);flex-wrap:wrap}.menu a{font-size:13px;font-weight:650;color:#333;text-decoration:none;transition:color .2s}.menu a:hover,.menu a:focus-visible{color:#76aa19}.menu .exit-link{color:#d63232}.wrap{width:min(100% - 32px,850px);margin:38px auto 60px;text-align:center}.eyebrow{color:#66951d;font-size:12px;font-weight:900;letter-spacing:3px;text-transform:uppercase}h1{font-size:clamp(30px,5vw,52px);margin:10px 0 10px;line-height:1.12}.lead{font-size:clamp(15px,2vw,18px);margin:0 0 26px;color:#64715a}.hero{width:min(100%,760px);aspect-ratio:16/9;margin:auto;border:7px solid white;border-radius:24px;overflow:hidden;box-shadow:0 18px 48px #526c3240;background:#87d9ed}.hero img{display:block;width:100%;height:100%;object-fit:cover}.counter-action{grid-column:auto;grid-row:auto}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:900px;margin:25px auto 0}.action{display:flex;align-items:center;justify-content:center;gap:9px;min-height:68px;padding:12px 10px;border-radius:18px;text-decoration:none;font-weight:850;font-size:clamp(13px,1.7vw,17px);color:white;background:linear-gradient(135deg,#9acd32,#4fbf79);box-shadow:0 8px 20px #6b9d2c40;transition:transform .2s,box-shadow .2s}.action:nth-child(2){background:linear-gradient(135deg,#1ab6bf,#168ed0)}.action.danger{background:linear-gradient(135deg,#ff6565,#dc303b);box-shadow:0 8px 20px #d33b3b30}.action:hover{transform:translateY(-4px);box-shadow:0 12px 25px #0002}.action:focus-visible,.menu a:focus-visible{outline:3px solid #f9ab35;outline-offset:4px}.foot{font-size:13px;color:#78836b;margin-top:32px}@media(max-width:1080px){.navbar{flex-direction:column;gap:12px}.menu{justify-content:center}}@media(max-width:620px){.counter-action,.actions .counter-action + .action,.actions .counter-action + .action + .action,.actions .counter-action + .action + .action + .action{grid-column:auto;grid-row:auto}.navbar{padding:14px 10px}.menu{gap:9px 14px}.menu a{font-size:11px}.wrap{margin-top:28px}.hero{border-width:4px;border-radius:16px}.actions{grid-template-columns:1fr;gap:11px}.action{min-height:58px;font-size:16px}.lead{margin-bottom:20px}}@media(prefers-reduced-motion:reduce){.action{transition:none}}
@media(min-width:768px){.hero{width:min(100%,540px)}.actions{max-width:850px}}.navbar{justify-content:flex-start;flex-direction:row;align-items:center;text-align:left;padding:1em 2em}.logo{font-size:1.5em;font-weight:bold;color:yellowgreen;text-decoration:none;text-align:left}

/* Mindig látható alsó kék sáv, a futó szöveg 4 másodperc után indul */
.bottom-ticker{position:fixed!important;bottom:0!important;left:0;right:0;width:100%;height:34px;background:#0876c4;overflow:hidden;z-index:99999;display:flex;align-items:center;opacity:1;visibility:visible}
.bottom-ticker span{position:absolute;white-space:nowrap;color:#ffe44d;font-size:clamp(12px,2.4vw,15px);font-weight:750;font-style:italic;animation:tickerMove 25s linear 4s infinite;animation-fill-mode:backwards;will-change:transform}

@keyframes tickerMove{from{transform:translateX(0);left:100%}to{transform:translateX(-100%);left:0}}
body{padding-bottom:110px}.wrap{margin-bottom:110px}@media(max-width:620px){body{padding-bottom:110px}.wrap{margin-bottom:110px}.actions{padding-bottom:45px}}
@media(prefers-reduced-motion:reduce){.bottom-ticker span{animation-duration:20s}}
    /* ===== NYÁRI VISSZASZÁMLÁLÓ ===== */
    #summer-countdown {
      /* 💻 ASZTALI / LAPTOP: ezt állítsd */
      top: 80px;

      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;

      width: min(76%, 520px);
      min-height: 28px;
      padding: 2px 8px;
      box-sizing: border-box;

      background: rgba(255,255,255,.96);
      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;

      color: #155e75;
      font-size: clamp(11px, 1.5vw, 14px);
      font-weight: 800;
      line-height: 1;

      box-shadow: 0 3px 9px rgba(0,0,0,.12);
    }

    #summer-countdown::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -35%;
      width: 30%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,215,0,.62),
        transparent
      );
      animation: shine 4s linear infinite;
    }

    #summer-countdown .sun,
    #summer-countdown .palm,
    #summer-countdown .text {
      position: relative;
      z-index: 1;
    }

    #summer-countdown .text {
      flex: 1;
      min-width: 0;
      text-align: center;
      line-height: 1.05;
      white-space: nowrap;
    }

    #summer-countdown .sun,
    #summer-countdown .palm {
      flex: 0 0 auto;
      font-size: 15px;
    }

    #summer-countdown .sun {
      animation: sun 2.4s ease-in-out infinite;
    }

    #summer-countdown .palm {
      transform-origin: bottom center;
      animation: palm 2.2s ease-in-out infinite;
    }

    #summer-countdown .days-highlight {
      color: #ff4f87;
      font-size: inherit;
      font-weight: 900;
      display: inline-block;
    }

    @keyframes shine {
      from { left: -35%; }
      to   { left: 120%; }
    }

    @keyframes sun {
      0%,100% { transform: rotate(-8deg) scale(1); }
      50%     { transform: rotate(8deg) scale(1.08); }
    }

    @keyframes palm {
      0%,100% { transform: rotate(-4deg); }
      50%     { transform: rotate(4deg); }
    }

    /* 📱 MOBIL: külön állítható TOP */
    @media (max-width: 700px) {
      #summer-countdown {
        top: 68px;   /* 📱 MOBILON EZT ÁLLÍTSD */

        width: 78%;
        max-width: 360px;
        min-height: 25px;
        padding: 2px 6px;
        gap: 3px;
        border-radius: 7px;

        font-size: clamp(9px, 2.8vw, 11px);
      }

      #summer-countdown .sun,
      #summer-countdown .palm {
        font-size: 13px;
      }
    }

    /* Keskeny telefonon csak a méret változik, a TOP nem */
    @media (max-width: 380px) {
      #summer-countdown {
        top: 12%;
        width: 82%;
        max-width: 300px;
        font-size: 9px;
        padding-left: 5px;
        padding-right: 5px;
      }

      #summer-countdown .sun,
      #summer-countdown .palm {
        font-size: 12px;
      }
    }
  /* A kép és a gombok lejjebb kerülnek, hogy a visszaszámláló ne takarja a képet. */
.wrap{margin-top:72px}
@media(max-width:620px){.wrap{margin-top:65px}}
</style>
</head>
<body>
<header class="navbar"><a class="logo" href="indexlezart.html">VakációVágyó</a></header>
  <!-- NYÁRI VISSZASZÁMLÁLÓ -->
  <div id="summer-countdown">
    <span class="sun">☀️</span>
    <span class="text">
      MÁR CSAK
      <span class="days-highlight"><span id="days">...</span> NAP</span>
      ÉS ITT A NYÁR!
    </span>
    <span class="palm">🌴</span>
  </div>


<main class="wrap">
<div class="hero" role="img" aria-label="Nyári kép"><img src="johogyittvagy.png" alt="Nyári kép"></div>
<div class="actions"><a class="action" href="iranykulfold.html">IRÁNY KÜLFÖLD</a><a class="action" href="eldujralezart.html">ÉLD ÚJRA</a><a class="action counter-action" href="szamlalo.html">SZÁMLÁLÓ</a><a class="action danger" href="https://www.google.com/">KILÉPÉS</a></div></main>
<div class="bottom-ticker" aria-label="Ezt itt a nyárkereső."><span> Jó, hogy itt vagy! A VakációVágyó rendszerünk jelenleg korlátozottan üzemel hiszen a közelmúltban voltunk vagy leszünk külföldi nyaraláson vagy a közeljövőben nem tervezünk külföldre utazni. Gyere vissza később!</span></div>
<script>
function updateCountdown() {
  const now = new Date();
  const text = document.querySelector("#summer-countdown .text");
  const year = now.getFullYear();

  const june1 = new Date(year, 5, 1, 0, 0, 0);
  const sep1  = new Date(year, 8, 1, 0, 0, 0);

  // Június 1-től augusztus 31-ig nyári felirat
  if (now >= june1 && now < sep1) {
    text.innerHTML = '„NYÁR VAN, ALIG FÜRDŐRUHÁBAN...”';
    return;
  }

  // Szeptember 1-től május 31-ig visszaszámlálás
  const target =
    now >= sep1
      ? new Date(year + 1, 5, 1, 0, 0, 0)
      : june1;

  const days = Math.ceil((target - now) / 86400000);

  text.innerHTML =
    'MÁR CSAK <span class="days-highlight"><span id="days">' +
    days +
    '</span> NAP</span> ÉS ITT A NYÁR!';
}

updateCountdown();
setInterval(updateCountdown, 60000);
</script>
</body></html>
